[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "living-docs"
version = "0.1.0"
description = "Self-updating documentation system — docs generated from code, config and git history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Living Docs Engine" }]
keywords = ["documentation", "ast", "codegen", "automation"]
dependencies = []

[project.scripts]
living-docs = "living_docs.cli:main"

[tool.living_docs]
source = "src"
docs = "docs"
features = "config/features.json"
prompts = "config/prompts.json"
changelog = true

[project.optional-dependencies]
# Tools used by the benchmark harness to compare against real-world generators.
bench = ["pdoc>=14", "sphinx>=7"]
dev = [
    "pdoc>=14",
    "sphinx>=7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "benchmarks/_tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests may use module-level fixtures and longer assertions.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["living_docs"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
